site_name: Symbiote — AgentBOM toolkit
site_description: Generate, validate, diff, verify, attest and enforce Agent Bills of Materials. Supports and extends CycloneDX 1.7 and SPDX 3.0.1.
site_url: https://aisecnomad.github.io/symbiote/
repo_url: https://github.com/aisecnomad/symbiote
repo_name: aisecnomad/symbiote
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - The gap analysis: gap-analysis.md
  - Concepts:
      - The four planes: concepts/four-planes.md
      - Assurance, claims and unknowns: concepts/assurance.md
      - Snapshots and the diff: concepts/snapshots.md
      - Digests and the Merkle commitment: concepts/digests.md
      - Trust model: concepts/trust-model.md
  - Guides:
      - Collectors: guides/collectors.md
      - Policy checks and conformance: guides/policy-and-conformance.md
      - Attestation and enforcement: guides/attestation-and-enforcement.md
      - Symbiote in CI: guides/ci.md
  - Formats:
      - CycloneDX 1.7: formats/cyclonedx.md
      - SPDX 3.0.1: formats/spdx.md
  - Reference:
      - CLI: reference/cli.md
  - Specification:
      - Overview: spec/README.md
      - AgentBOM profile: spec/agentbom-profile.md
      - Digests: spec/digests.md
      - CycloneDX 1.7 mapping: spec/cyclonedx-mapping.md
      - Property taxonomy: spec/taxonomy.md
      - SPDX 3.0.1 mapping: spec/spdx-mapping.md
      - Companion document: spec/companion.md
      - Conformance levels: spec/conformance.md
      - Policy checks: spec/checks.md
      - Attestation: spec/attestation.md
      - Gateway admission: spec/gateway-admission.md
      - Incident query: spec/incident-query.md
      - Native inventory migration: spec/native-inventory-migration.md
      - Collectors: spec/collectors.md
      - Nexus ShadowScan mapping: spec/shadowscan-mapping.md
      - CLI: spec/cli.md
      - Divergence register: spec/divergences.md
      - Versioning: spec/versioning.md
      - Decision records:
          - ADR-0001 Python stack: spec/adr/0001-python-stack.md
          - ADR-0002 agentbom namespace: spec/adr/0002-agentbom-namespace.md
          - ADR-0003 CycloneDX direct emission: spec/adr/0003-cyclonedx-direct-emission.md
          - ADR-0004 Typed digest envelopes: spec/adr/0004-typed-digest-envelopes.md
          - ADR-0005 Assurance and states: spec/adr/0005-assurance-and-states.md
  - Integrations:
      - Nexus ShadowScan: integrations/shadowscan.md
  - Research:
      - Overview: research/README.md
      - Design brief: research/design-brief.md
      - Exporter notes: research/exporter-notes-ihvm.md
      - Proposals:
          - Enforcement-first: research/proposals/enforcement-first.md
          - Standards-purist: research/proposals/standards-purist.md
          - Adoption-first: research/proposals/adoption-first.md
  - Development:
      - Work packages: development/work-packages.md
      - Contributing: contributing.md
      - Security policy: SECURITY.md
      - Threat model: THREAT-MODEL.md
      - Code of conduct: CODE_OF_CONDUCT.md

plugins:
  - search

hooks: []

tool: wasmagent-agentbom
display: "WasmAgent agentbom-core 0.4.0 (spec and library)"
runnable: false
not_run_reason: >
  A TypeScript library that validates, compliance-checks and diffs documents in its own
  AgentBOM format. It does not discover components, so there is no scan to run against the
  fixture. The library's validate, compliance and diff functions were exercised on a
  hand-written document (see RESULTS.md); everything else is from its README.
claimed_dimensions: [D3, D5, D8]
claimed_families: [agent, mcp]

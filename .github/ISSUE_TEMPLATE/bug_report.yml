name: Bug report
description: Report a bug in Nexus SymBiote
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for reporting a bug. Please fill out the sections below.
        **Do not include credentials, private BOMs, or customer data.**
        For security vulnerabilities, use [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `nexus-symbiote scan ...`
        2. Observe error in output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or output.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Nexus SymBiote version
      description: Output of `nexus-symbiote --version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "3.12.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant terminal output. This will be formatted as code.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context about the problem (configuration, project structure, etc.).

name: Platform smoke
# Not part of Verified CI: the supported matrix is Linux. These tests take branches that
# Linux never reaches (a case-insensitive file system, macOS temporary-directory symlinks),
# so a failure here is a defect in that branch, not in the change that happened to run it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 3 * * 4"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: macOS case-insensitive and confinement branches
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked full test environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run the signature-gate, discovery and confinement tests
        run: >-
          python -m pytest -vv -rs
          tests/test_action_signature_policy.py
          tests/test_discovery_signature_gate.py
          tests/test_confined_integrity.py
          tests/test_output_confinement.py
          tests/test_prompt_confined_reads.py

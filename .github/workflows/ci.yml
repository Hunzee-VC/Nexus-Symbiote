name: CI

on:
  push:
    branches: [main, "claude/**", "wp-**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          . .venv/bin/activate
          uv pip install -e ".[dev,sign]"
      - name: Lint and format
        run: |
          . .venv/bin/activate
          ruff format --check src tests
          ruff check src tests
      - name: Type-check
        run: |
          . .venv/bin/activate
          mypy src/symbiote || true   # advisory until the public API settles
      - name: Test
        run: |
          . .venv/bin/activate
          pytest -q --cov --cov-report=xml
      - name: Companion schema is up to date
        run: |
          . .venv/bin/activate
          symbiote schema export companion -o /tmp/agentbom.schema.json
          diff -u src/symbiote/schemas/agentbom/agentbom-0.1.schema.json /tmp/agentbom.schema.json
      - name: Self-check CLI
        run: |
          . .venv/bin/activate
          symbiote version --json
          printf '{"name":"echo","inputSchema":{"type":"object"}}' > /tmp/tool.json
          symbiote digest tooldef /tmp/tool.json --json

  shadowscan-interop:
    name: Nexus ShadowScan interop (inventory round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Symbiote and ShadowScan (separate environments)
        run: |
          uv venv .venv --python 3.13
          . .venv/bin/activate
          uv pip install -e ".[dev]"
          deactivate
          uv venv .venv-shadowscan --python 3.13
          .venv-shadowscan/bin/python -m pip install --quiet "NexusShadowScan>=0.1.4,<0.2"
          .venv-shadowscan/bin/shadowscan --version
      - name: Generated inventories register the example agent in ShadowScan
        run: |
          . .venv/bin/activate
          SYMBIOTE_SHADOWSCAN_BIN="$PWD/.venv-shadowscan/bin/shadowscan" pytest -q tests/unit/test_shadowscan.py
      - name: Round trip on the example (ShadowScan report -> observed snapshot -> inventory -> ShadowScan)
        run: |
          . .venv/bin/activate
          .venv-shadowscan/bin/shadowscan code examples/triage-agent --format json -o /tmp/ss.json
          symbiote shadowscan import /tmp/ss.json -o /tmp/observed --deterministic
          symbiote scan examples/triage-agent -o /tmp/declared --deterministic --format companion
          symbiote shadowscan inventory /tmp/declared/agentbom.json -o /tmp/inventory --scan-root "$PWD/examples/triage-agent"
          .venv-shadowscan/bin/shadowscan inventory check /tmp/inventory
          .venv-shadowscan/bin/shadowscan code examples/triage-agent --inventory /tmp/inventory --format json -o /tmp/ss-registered.json
          python -c "import json,sys; r=json.load(open('/tmp/ss-registered.json')); s=r['summary']; print(s['total'], 'findings,', s['shadow'], 'shadow'); sys.exit(0 if s['shadow']==0 and r['inventory_present'] else 1)"
          symbiote shadowscan reconcile /tmp/declared/agentbom.json /tmp/ss.json

  rego-parity:
    name: Rego export parity (OPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Install
        run: |
          uv venv .venv --python 3.12
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Built-in findings equal OPA findings for every exported check
        env:
          SYMBIOTE_REQUIRE_OPA: "1"
        run: |
          . .venv/bin/activate
          opa version
          pytest -q -rs tests/unit/policy/test_rego.py
          symbiote policy export-rego "$RUNNER_TEMP/rego"
          opa check "$RUNNER_TEMP/rego"

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv .venv --python 3.12 && . .venv/bin/activate
          uv pip install -e ".[dev]"
          mkdocs build --strict

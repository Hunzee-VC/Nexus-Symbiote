name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked full test environment
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
  coverage:
    name: Coverage Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked full test environment
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest --cov=nexus_symbiote --cov-report=term-missing
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked quality environment
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/nexus_symbiote
      - run: python scripts/check_workflows.py
      - run: python scripts/check_docs.py
      - run: python scripts/generate_schemas.py --check
      - run: python scripts/generate_cli_reference.py --check
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked build environment
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and exercise built wheel outside source tree
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m nexus_symbiote --version
          "$RUNNER_TEMP/wheel-smoke/bin/nexus-symbiote" --version
          mkdir "$RUNNER_TEMP/wheel-fixture"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m nexus_symbiote scan "$RUNNER_TEMP/wheel-fixture" --report-only -f json -o wheel-agentbom.json
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m nexus_symbiote scan "$RUNNER_TEMP/wheel-fixture" --report-only -f cyclonedx -o wheel-agentbom.cdx.json
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m nexus_symbiote scan "$RUNNER_TEMP/wheel-fixture" --report-only -f spdx -o wheel-agentbom.spdx.json
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c 'import json; d=json.load(open("wheel-agentbom.json")); assert "components" in d; assert d["metadata"]["completeness"]["offline_enforced"] is True'

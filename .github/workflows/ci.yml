name: CI

on:
  push:
    branches: [main, "claude/**", "wp-**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          uv venv .venv --python ${{ matrix.python }}
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Lint and format
        run: |
          . .venv/bin/activate
          ruff format --check src tests
          ruff check src tests
      - name: Type-check
        run: |
          . .venv/bin/activate
          mypy src/symbiote || true   # advisory until the public API settles
      - name: Test
        run: |
          . .venv/bin/activate
          pytest -q --cov --cov-report=xml
      - name: Companion schema is up to date
        run: |
          . .venv/bin/activate
          symbiote schema export companion -o /tmp/agentbom.schema.json
          diff -u src/symbiote/schemas/agentbom/agentbom-0.1.schema.json /tmp/agentbom.schema.json
      - name: Self-check CLI
        run: |
          . .venv/bin/activate
          symbiote version --json
          printf '{"name":"echo","inputSchema":{"type":"object"}}' > /tmp/tool.json
          symbiote digest tooldef /tmp/tool.json --json

  rego-parity:
    name: Rego export parity (OPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Install
        run: |
          uv venv .venv --python 3.12
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Built-in findings equal OPA findings for every exported check
        env:
          SYMBIOTE_REQUIRE_OPA: "1"
        run: |
          . .venv/bin/activate
          opa version
          pytest -q -rs tests/unit/policy/test_rego.py
          symbiote policy export-rego "$RUNNER_TEMP/rego"
          opa check "$RUNNER_TEMP/rego"

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv .venv --python 3.12 && . .venv/bin/activate
          uv pip install -e ".[dev]"
          mkdocs build --strict

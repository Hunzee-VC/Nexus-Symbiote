name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked full test environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run full test suite with bounded diagnostics
        env:
          PYTEST_LOG: ${{ runner.temp }}/pytest-python-${{ matrix.python }}.log
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 16m \
            bash --noprofile --norc -e -o pipefail -c '
              python -m pytest -vv --strict-skips --durations=20 -o test_timeout=120 \
                2>&1 | tee "$PYTEST_LOG"
            '
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pytest-python-${{ matrix.python }}.log
          if-no-files-found: error
          retention-days: 7
  floor:
    name: Tests at the declared dependency floors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install every runtime dependency and the build backend at its declared floor
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-floor.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      # Tests marked locked_only compare what a pinned library generates (the JSON schema
      # pydantic derives from the models) with a committed file; the test job runs them.
      - name: Run the full test suite at the floors, except locked_only tests
        env:
          PYTEST_LOG: ${{ runner.temp }}/pytest-floor.log
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 16m \
            bash --noprofile --norc -e -o pipefail -c '
              python -m pytest -vv --strict-skips -m "not locked_only" --durations=20 \
                -o test_timeout=120 2>&1 | tee "$PYTEST_LOG"
            '
      - name: Preserve floor diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-floor
          path: ${{ runner.temp }}/pytest-floor.log
          if-no-files-found: error
          retention-days: 7
  coverage:
    name: Coverage Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked full test environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run full coverage suite with bounded diagnostics
        env:
          PYTEST_LOG: ${{ runner.temp }}/pytest-coverage-python-3.12.log
          COVERAGE_JSON: ${{ runner.temp }}/coverage-python-3.12.json
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 25m \
            bash --noprofile --norc -e -o pipefail -c '
              python -m pytest -vv --strict-skips --durations=20 -o test_timeout=240 \
                --cov=nexus_symbiote --cov=scripts --cov-branch --cov-report=term-missing \
                --cov-report="json:$COVERAGE_JSON" \
                2>&1 | tee "$PYTEST_LOG"
            '
      - name: Enforce statement, branch and security-module coverage floors
        env:
          COVERAGE_JSON: ${{ runner.temp }}/coverage-python-3.12.json
        run: python scripts/check_coverage.py "$COVERAGE_JSON"
      - name: Preserve coverage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-coverage-python-3.12
          path: |
            ${{ runner.temp }}/pytest-coverage-python-3.12.log
            ${{ runner.temp }}/coverage-python-3.12.json
          if-no-files-found: error
          retention-days: 7
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked quality environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/nexus_symbiote scripts
      - run: python scripts/check_workflows.py
      - run: python scripts/check_repository_hygiene.py
      - name: Cap pull request size outside tests
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$PR_BASE"
          python scripts/check_pull_request_size.py --base "origin/$PR_BASE"
      - name: Require the locks to match pyproject.toml and each other
        run: python scripts/check_locks.py
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked build environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - name: Run security acceptance against the exact built wheel
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python -I scripts/check_wheel_security.py dist/*.whl
      - name: Exercise the wheel on freshly resolved dependencies outside the source tree
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --only-binary=:all: dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip freeze --all
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I scripts/check_installed_wheel.py --source .
  security-regressions:
    name: Committed security regression contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the Action's locked runtime and reviewed source
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-action.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Enforce each committed security case
        env:
          REGRESSION_REPORT: ${{ runner.temp }}/security-regressions.json
        run: python scripts/check_security_regressions.py --out "$REGRESSION_REPORT"
      - name: Retain per-case security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-regression-evidence
          path: ${{ runner.temp }}/security-regressions.json
          if-no-files-found: error
          retention-days: 14
  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the reviewed dependency inventory
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Require complete OSV lookups and no known advisories for every locked pin
        env:
          ADVISORY_REPORT: ${{ runner.temp }}/dependency-advisories.json
        run: >-
          python scripts/check_dependency_advisories.py
          --lock requirements-ci.lock --lock requirements-action.lock
          --out "$ADVISORY_REPORT"
      - name: Retain exact dependency and advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-advisory-evidence
          path: ${{ runner.temp }}/dependency-advisories.json
          if-no-files-found: error
          retention-days: 14
  codeql:
    name: CodeQL policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          queries: security-and-quality
      - name: Analyze the checked-out workflow commit
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
          output: ${{ runner.temp }}/codeql-sarif
      - name: Reject high and critical security findings
        env:
          SARIF_PATH: ${{ runner.temp }}/codeql-sarif/python.sarif
          CODEQL_REPORT: ${{ runner.temp }}/codeql-policy.json
        run: python scripts/check_codeql_sarif.py "$SARIF_PATH" --out "$CODEQL_REPORT"
      - name: Retain CodeQL analysis and policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-policy-evidence
          path: |
            ${{ runner.temp }}/codeql-sarif/*.sarif
            ${{ runner.temp }}/codeql-policy.json
          if-no-files-found: error
          retention-days: 14
  action:
    name: Composite Action end to end (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the job's interpreter before the Action runs
        id: before
        run: |
          echo "python3=$(command -v python3)" >> "$GITHUB_OUTPUT"
          echo "prefix=$(python3 -c 'import sys; print(sys.prefix)')" >> "$GITHUB_OUTPUT"
      - name: Create passing, failing and hostile fixtures in the workspace
        run: |
          set -euo pipefail
          fixtures=action-fixtures
          mkdir -p "$fixtures/passing" "$fixtures/failing/models" "$fixtures/hostile/models"
          for fixture in passing failing hostile; do
            printf 'Use the configured tools.\n' > "$fixtures/$fixture/CLAUDE.md"
            printf 'name: Demo\ninstructions: [CLAUDE.md]\n' > "$fixtures/$fixture/agent.yaml"
          done
          printf 'unsafe-format-fixture' > "$fixtures/failing/models/classifier.pkl"
          # Workflow commands in names the inventory prints: a legacy set-output aimed
          # at the upload paths and annotations carrying a marker the next job looks for.
          # The Action pre-seeds every output in GITHUB_OUTPUT, which the runner applies
          # after the step, so a set-output it executed would change no output; the
          # runner's deprecation warning for it is the evidence the next job looks for.
          printf '%s\n' 'name: Demo' 'instructions: [CLAUDE.md]' 'models:' '  m:' \
            '    provider: example' \
            '    requested_ref: "x ##[set-output name=sarif_path]/etc/hostname%0A ::set-output name=aibom_path::/etc/hostname"' \
            > "$fixtures/hostile/agent.yaml"
          printf 'unsafe' > "$fixtures/hostile/models/##[warning]symbiote-injected-annotation.pkl"
          printf 'unsafe' > "$fixtures/hostile/models/::warning::symbiote-injected-annotation.pkl"
      - name: Passing fixture
        id: passing
        uses: ./
        with:
          scan-path: action-fixtures/passing
          output-file: action-out/passing.json
          python-version: ${{ matrix.python }}
          artifact-name: action-e2e-passing-${{ matrix.python }}
      - name: Failing fixture
        id: failing
        continue-on-error: true
        uses: ./
        with:
          scan-path: action-fixtures/failing
          output-file: action-out/failing.json
          python-version: ${{ matrix.python }}
          artifact-name: action-e2e-failing-${{ matrix.python }}
      - name: Threshold 0 still fails a critical finding
        id: threshold
        continue-on-error: true
        uses: ./
        with:
          scan-path: action-fixtures/failing
          output-file: action-out/threshold.json
          validate: "false"
          risk-threshold: "0"
          upload-artifact: "false"
          python-version: ${{ matrix.python }}
      - name: Hostile fixture
        id: hostile
        continue-on-error: true
        uses: ./
        with:
          scan-path: action-fixtures/hostile
          output-file: action-out/hostile.json
          python-version: ${{ matrix.python }}
          artifact-name: action-e2e-hostile-${{ matrix.python }}
      - name: Assert outcomes, outputs and the caller's interpreter
        env:
          BEFORE_PYTHON: ${{ steps.before.outputs.python3 }}
          BEFORE_PREFIX: ${{ steps.before.outputs.prefix }}
          PASSING_OUTCOME: ${{ steps.passing.outcome }}
          PASSING_RESULT: ${{ steps.passing.outputs.result }}
          PASSING_GATES: ${{ steps.passing.outputs.gates }}
          PASSING_VALIDATION: ${{ steps.passing.outputs.validation-passed }}
          PASSING_RISK: ${{ steps.passing.outputs.risk-passed }}
          PASSING_PATH: ${{ steps.passing.outputs.aibom-path }}
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_RESULT: ${{ steps.failing.outputs.result }}
          FAILING_GATES: ${{ steps.failing.outputs.gates }}
          FAILING_VALIDATION: ${{ steps.failing.outputs.validation-passed }}
          FAILING_RISK: ${{ steps.failing.outputs.risk-passed }}
          FAILING_PATH: ${{ steps.failing.outputs.aibom-path }}
          THRESHOLD_OUTCOME: ${{ steps.threshold.outcome }}
          THRESHOLD_RESULT: ${{ steps.threshold.outputs.result }}
          THRESHOLD_GATES: ${{ steps.threshold.outputs.gates }}
          THRESHOLD_VALIDATION: ${{ steps.threshold.outputs.validation-passed }}
          THRESHOLD_RISK: ${{ steps.threshold.outputs.risk-passed }}
          THRESHOLD_PATH: ${{ steps.threshold.outputs.aibom-path }}
          HOSTILE_OUTCOME: ${{ steps.hostile.outcome }}
          HOSTILE_RESULT: ${{ steps.hostile.outputs.result }}
          HOSTILE_GATES: ${{ steps.hostile.outputs.gates }}
          HOSTILE_VALIDATION: ${{ steps.hostile.outputs.validation-passed }}
          HOSTILE_RISK: ${{ steps.hostile.outputs.risk-passed }}
          HOSTILE_PATH: ${{ steps.hostile.outputs.aibom-path }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import shutil
          import sys

          workspace = os.environ["GITHUB_WORKSPACE"]
          gates = ("collection", "completeness", "integrity", "risk", "drift")
          expected = {
              "PASSING": ("success", "passed", "passed passed passed passed skipped", "true", "true"),
              "FAILING": ("failure", "failed", "passed passed failed failed skipped", "false", "false"),
              "THRESHOLD": ("failure", "failed", "passed skipped skipped failed skipped", "skipped", "false"),
              "HOSTILE": ("failure", "failed", "passed passed failed failed skipped", "false", "false"),
          }
          failures = []
          for name, (outcome, result, states, validation, risk) in expected.items():
              def check(field, wanted):
                  actual = os.environ[f"{name}_{field}"]
                  if actual != wanted:
                      failures.append(f"{name.lower()} {field.lower()}: {actual!r}, expected {wanted!r}")
              check("OUTCOME", outcome)
              check("RESULT", result)
              check("VALIDATION", validation)
              check("RISK", risk)
              check("PATH", os.path.join(workspace, "action-out", name.lower() + ".json"))
              try:
                  recorded = json.loads(os.environ[f"{name}_GATES"])
              except ValueError:
                  recorded = None
              if recorded != dict(zip(gates, states.split(), strict=True)):
                  failures.append(f"{name.lower()} gates: {recorded!r}, expected {states}")
          # The Action keeps its interpreter and virtual environment to itself.
          if shutil.which("python3") != os.environ["BEFORE_PYTHON"]:
              failures.append("python3 on PATH changed after the Action")
          if sys.prefix != os.environ["BEFORE_PREFIX"]:
              failures.append("the job's default Python changed after the Action")
          if shutil.which("nexus-symbiote") or "pythonLocation" in os.environ:
              failures.append("the Action's Python or virtual environment leaked into the job")
          for failure in failures:
              print(failure)
          sys.exit(bool(failures))
          PY
      - name: Download the hostile fixture's evidence
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-e2e-hostile-${{ matrix.python }}
          path: ${{ runner.temp }}/hostile-evidence
          digest-mismatch: error
      # The artifact service can report an artifact missing for a moment after it has
      # accepted the upload. One later attempt decides; a second failure fails the job.
      - name: Wait before a second attempt
        if: steps.evidence.outcome == 'failure'
        run: sleep 20
      - name: Download the evidence again
        if: steps.evidence.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-e2e-hostile-${{ matrix.python }}
          path: ${{ runner.temp }}/hostile-evidence
          digest-mismatch: error
      - name: The evidence holds only the requested export
        env:
          EVIDENCE: ${{ runner.temp }}/hostile-evidence
        run: |
          set -euo pipefail
          find "$EVIDENCE" -type f -print
          test "$(find "$EVIDENCE" -type f | wc -l)" -eq 1
          test -f "$EVIDENCE/hostile.json"
  action-annotations:
    name: Composite Action injection created no annotation
    needs: action
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
    steps:
      - name: Reject any annotation that carries the injected marker or a legacy command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name | startswith("Composite Action end to end")) | .check_run_url' \
            > "$RUNNER_TEMP/check-runs"
          test "$(wc -l < "$RUNNER_TEMP/check-runs")" -eq 4
          while read -r url; do
            gh api --paginate "${url#https://api.github.com/}/annotations" \
              --jq '.[] | (.title // "") + " " + (.message // "")'
          done < "$RUNNER_TEMP/check-runs" > "$RUNNER_TEMP/annotations"
          cat "$RUNNER_TEMP/annotations"
          # An executed set-output or save-state leaves only the runner's deprecation warning.
          if grep -Ei 'symbiote-injected-annotation|set-output|save-state' "$RUNNER_TEMP/annotations"; then
            echo "A workflow command from the scanned checkout created an annotation"
            exit 1
          fi
  verified:
    name: Verified CI
    if: always()
    needs:
      - test
      - floor
      - coverage
      - quality
      - distribution
      - security-regressions
      - dependency-audit
      - codeql
      - action
      - action-annotations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["CI_RESULTS"])
          expected = {"test", "floor", "coverage", "quality", "distribution", "security-regressions", "dependency-audit", "codeql", "action", "action-annotations"}
          if not isinstance(results, dict) or set(results) != expected:
              print("Verification metadata does not contain exactly the required jobs")
              sys.exit(1)
          failed = [
              name for name, result in results.items()
              if not isinstance(result, dict) or result.get("result") != "success"
          ]
          if failed:
              print("Verification did not succeed: " + ", ".join(sorted(failed)))
          sys.exit(bool(failed))
          PY

name: Offline invariant verification
# Verifies Invariant 2 (offline by default, R1.0.0-1) inside a Linux network namespace
# with only loopback active, turning the Python socket tripwire into kernel-enforced egress denial.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-invariant-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-sandbox:
    name: Offline invariant (OS network denied)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked test environment
        run: |
          python -m venv "$RUNNER_TEMP/offline-venv"
          "$RUNNER_TEMP/offline-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          "$RUNNER_TEMP/offline-venv/bin/python" -m pip install --no-deps --no-build-isolation -e .
          "$RUNNER_TEMP/offline-venv/bin/python" -m pip check
      - name: Run full test suite inside kernel network-denied namespace
        env:
          PYTEST_LOG: ${{ runner.temp }}/pytest-offline-invariant.log
        run: |
          set -euo pipefail
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          OFFLINE_PYTHON="$RUNNER_TEMP/offline-venv/bin/python"
          export HOST_UID HOST_GID OFFLINE_PYTHON
          sudo --preserve-env=HOST_UID,HOST_GID,OFFLINE_PYTHON,PYTEST_LOG,RUNNER_TEMP,HOME,TMPDIR \
            unshare --net bash --noprofile --norc -euo pipefail -c '
              ip link set lo up
              setpriv --reuid="$HOST_UID" --regid="$HOST_GID" --clear-groups \
                "$OFFLINE_PYTHON" - <<'"'"'PY'"'"'
          import socket
          for family, addr in (
              (socket.AF_INET, ("1.1.1.1", 443)),
              (socket.AF_INET6, ("2606:4700:4700::1111", 443)),
          ):
              sock = socket.socket(family, socket.SOCK_STREAM)
              try:
                  sock.settimeout(1.0)
                  try:
                      sock.connect(addr)
                  except OSError:
                      pass
                  else:
                      raise SystemExit(f"Expected kernel egress denial for {addr}")
              finally:
                  sock.close()
          PY
              exec setpriv --reuid="$HOST_UID" --regid="$HOST_GID" --clear-groups \
                timeout --signal=INT --kill-after=30s 30m \
                "$OFFLINE_PYTHON" -m pytest -vv --strict-skips -o test_timeout=120 2>&1 \
                | tee "$PYTEST_LOG"
            '
      - name: Preserve offline invariant diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-offline-invariant
          path: ${{ runner.temp }}/pytest-offline-invariant.log
          if-no-files-found: error
          retention-days: 7

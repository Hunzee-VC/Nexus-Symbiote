name: Platform smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS smoke Python ${{ matrix.python }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked full test environment
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Smoke-test the CLI and demo-agent scan
        run: |
          nexus-symbiote --version
          nexus-symbiote scan examples/demo-agent --no-project-policy --report-only -o smoke.aibom.json
          nexus-symbiote summary smoke.aibom.json
          nexus-symbiote scan examples/demo-agent --no-project-policy --report-only -f cyclonedx -o smoke.cdx.json
          nexus-symbiote scan examples/demo-agent --no-project-policy --report-only -f spdx     -o smoke.spdx.json
          nexus-symbiote scan examples/demo-agent --no-project-policy --report-only -f sarif    -o smoke.sarif
      - name: Run the full test suite with bounded diagnostics
        env:
          PYTEST_LOG: ${{ runner.temp }}/pytest-macos-python-${{ matrix.python }}.log
        run: |
          set -o pipefail
          python -m pytest -vv -o faulthandler_timeout=120 --durations=20 \
            2>&1 | tee "$PYTEST_LOG"
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-macos-python-${{ matrix.python }}
          path: ${{ runner.temp }}/pytest-macos-python-${{ matrix.python }}.log
          if-no-files-found: error
          retention-days: 7

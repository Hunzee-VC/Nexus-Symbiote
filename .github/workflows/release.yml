name: Release candidate and approved publication

# Builds, tests and attests a release candidate from the reviewed main commit.
# Uploading is opt-in and manual: with the default `publish: none` the run only
# retains evidence. `testpypi` rehearses the upload; `pypi` additionally
# requires the tag v<version> on the reviewed commit. The upload job waits for
# approval in the protected environment of that name, checks out nothing and
# uploads the exact attested wheel and sdist through PyPI trusted publishing;
# no package-index token is stored anywhere. See docs/operations/releasing.md.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full 40-character SHA of the reviewed main commit this candidate is built from
        required: true
        type: string
      publish:
        description: "Upload the attested wheel and sdist: none (evidence only), testpypi (rehearsal) or pypi (needs tag v<version> on expected_commit)"
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify the candidate is the reviewed commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python - <<'PY'
          import os
          import re

          expected = os.environ["EXPECTED_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("expected_commit must be a full lowercase 40-character SHA")
          if expected != os.environ["GITHUB_SHA"]:
              raise SystemExit("main moved; review and select the current main commit")
          PY
      - name: Install locked release checks
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: mypy src/nexus_symbiote
      - run: python scripts/check_workflows.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test wheel and collect release evidence
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          mkdir -p evidence
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip inspect > evidence/installed-distributions.json
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote --version
          "$RUNNER_TEMP/release-smoke/bin/nexus-symbiote" --version
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote scan "$GITHUB_WORKSPACE" --report-only -f cyclonedx -o "$GITHUB_WORKSPACE/evidence/project.cdx.json"
      - name: Package the installed wheel's inventory benchmark
        run: |
          "$RUNNER_TEMP/release-smoke/bin/python" benchmarks/inventory/evidence.py prepare "$RUNNER_TEMP/inventory-benchmark"
          sha256sum dist/*.whl > "$RUNNER_TEMP/inventory-benchmark/wheel.sha256"
          tar -C "$RUNNER_TEMP/inventory-benchmark" -czf evidence/inventory-benchmark.tar.gz results.json statement.json wheel.sha256
          python scripts/release_checksums.py
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - name: Upload SBOM and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence
          path: evidence/*
          if-no-files-found: error
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No source checkout or package execution in this job with signing rights.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-distributions
          path: dist
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-evidence
          path: evidence
      - name: Attest inventory benchmark results and wheel digest
        id: inventory
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: evidence/inventory-benchmark.tar.gz
      - name: Retain inventory attestation bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: inventory-benchmark-attestation
          path: ${{ steps.inventory.outputs.bundle-path }}
          if-no-files-found: error
  publication-gate:
    if: inputs.publish != 'none' && github.ref == 'refs/heads/main'
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the release tag through the API. No checkout and no OIDC token.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-evidence
          path: evidence
      - name: Require one attested wheel and sdist of a public version and, for pypi, its tag on the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          grep '  dist/' evidence/SHA256SUMS | sha256sum --check --strict
          wheels=(dist/nexus_symbiote-*.whl)
          sdists=(dist/nexus_symbiote-*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ ! -f "${wheels[0]}" ]; then
            echo "expected exactly one wheel" >&2
            exit 1
          fi
          if [ "${#sdists[@]}" -ne 1 ] || [ ! -f "${sdists[0]}" ]; then
            echo "expected exactly one sdist" >&2
            exit 1
          fi
          version="${wheels[0]#dist/nexus_symbiote-}"
          version="${version%%-*}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "wheel version $version is not a public release version" >&2
            exit 1
          fi
          if [ "${sdists[0]}" != "dist/nexus_symbiote-$version.tar.gz" ]; then
            echo "sdist ${sdists[0]} does not match wheel version $version" >&2
            exit 1
          fi
          if [ "$PUBLISH" = pypi ]; then
            if ! tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$version" --jq .sha)"; then
              echo "tag v$version does not exist; tag the reviewed commit $GITHUB_SHA first" >&2
              exit 1
            fi
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "tag v$version points at $tagged, not the reviewed commit $GITHUB_SHA" >&2
              exit 1
            fi
          fi
          echo "Publishing nexus-symbiote $version to $PUBLISH from $GITHUB_SHA"
  publish:
    if: inputs.publish != 'none' && github.ref == 'refs/heads/main'
    needs: [build, attest, publication-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that uploads. It waits for approval in the protected
    # environment named by `publish`, whose trusted publisher on the package
    # index accepts this workflow and environment only. The OIDC token is its
    # only permission; it checks out nothing and uploads the attested files.
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/p/nexus-symbiote' || 'https://pypi.org/p/nexus-symbiote' }}
    permissions:
      id-token: write
    # No run steps: the job holding the OIDC token executes nothing but the two
    # pinned actions. The token-less publication-gate job verified these bytes.
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-distributions
          path: dist
      - name: Upload with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          packages-dir: dist/
          attestations: true
          print-hash: true

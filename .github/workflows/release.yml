name: Release candidate and approved publication
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified distributions using the protected pypi environment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked release checks
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: mypy src/nexus_symbiote
      - run: python scripts/check_workflows.py
      - name: Build distributions with the locked backend
        run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Run security acceptance against the exact built wheel
        run: |
          python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
          python -I scripts/check_wheel_security.py dist/*.whl
      - name: Smoke-test wheel and collect release evidence
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          mkdir -p evidence
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip inspect > evidence/installed-distributions.json
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote --version
          "$RUNNER_TEMP/release-smoke/bin/python" -m nexus_symbiote scan "$GITHUB_WORKSPACE" --report-only -f cyclonedx -o "$GITHUB_WORKSPACE/evidence/project.cdx.json"
      - name: Package the installed wheel's inventory benchmark
        run: |
          "$RUNNER_TEMP/release-smoke/bin/python" benchmarks/inventory/evidence.py prepare "$RUNNER_TEMP/inventory-benchmark"
          sha256sum dist/*.whl > "$RUNNER_TEMP/inventory-benchmark/wheel.sha256"
          tar -C "$RUNNER_TEMP/inventory-benchmark" -czf evidence/inventory-benchmark.tar.gz results.json statement.json wheel.sha256
          python scripts/release_checksums.py
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - name: Upload SBOM and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence
          path: evidence/*
          if-no-files-found: error
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-distributions
          path: dist
      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-evidence
          path: evidence
      - name: Attest inventory benchmark results and wheel digest
        id: inventory
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: evidence/inventory-benchmark.tar.gz
      - name: Retain inventory attestation bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: inventory-benchmark-attestation
          path: ${{ steps.inventory.outputs.bundle-path }}
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nexus-symbiote
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-distributions
          path: dist
      - name: Publish with OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          attestations: true

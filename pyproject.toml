[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexus-symbiote"
dynamic = ["version"]
description = "Agent Bill of Materials (AgentBOM) for AI agent supply chains: inventory MCP servers and tools, models, prompts, retrieval, registries, A2A and IDE agents; export CycloneDX, SPDX, SARIF and VEX; validate, score and diff"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Emmanuel Dahunsi", email = "immanueldahunsi@gmail.com" },
]
keywords = [
    "agentbom",
    "aibom",
    "sbom",
    "ai-security",
    "supply-chain",
    "agentic-ai",
    "mcp",
    "model-context-protocol",
    "a2a",
    "cyclonedx",
    "spdx",
    "sarif",
    "vex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
# Each range caps the next major so an untested upstream major cannot resolve
# into an unlocked install. requirements-ci.lock pins the exact reviewed set.
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.5,<3",
    "rich>=13.0,<14",
    "rfc8785>=0.1.4,<1",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
    "cryptography>=43,<48",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "packaging>=24,<27",
]

[project.optional-dependencies]
cyclonedx = [
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
]
sigstore = [
    "sigstore>=3.6.7,<4",
]
all = [
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
    "sigstore>=3.6.7,<4",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.23,<5",
    "sigstore>=3.6.7,<4",
    "build>=1.2,<2",
    "twine>=6.0,<7",
    "hypothesis>=6.0,<7",
    "spdx-python-model>=0.0.6,<1",
    "cyclonedx-python-lib[json-validation]>=11.12,<12",
    "hatchling>=1.27,<2",
    "editables>=0.5,<1",
]

[project.scripts]
nexus-symbiote = "nexus_symbiote.cli:main"

[project.urls]
Homepage = "https://github.com/aisecnomad/Nexus-symbiote"
Documentation = "https://github.com/aisecnomad/Nexus-symbiote/blob/main/docs/index.md"
Repository = "https://github.com/aisecnomad/Nexus-symbiote"
Changelog = "https://github.com/aisecnomad/Nexus-symbiote/blob/main/CHANGELOG.md"
Security = "https://github.com/aisecnomad/Nexus-symbiote/blob/main/SECURITY.md"
Issues = "https://github.com/aisecnomad/Nexus-symbiote/issues"

[tool.hatch.version]
path = "src/nexus_symbiote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_symbiote"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "RUF100"]
ignore = ["S101", "UP042", "E501", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --tb=short"

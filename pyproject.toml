[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "symbiote"
version = "0.1.0"
description = "Symbiote: the Agent Bill of Materials (AgentBOM) toolkit for the agentic-AI supply chain. Generates, validates, diffs, verifies, attests and enforces AgentBOMs; extends CycloneDX 1.7 and SPDX 3.0.1 without forking either."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "AISecNomad" }]
keywords = ["agentbom", "aibom", "sbom", "cyclonedx", "spdx", "mcp", "ai-agents", "supply-chain-security", "attestation", "sigstore", "in-toto"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.21",
  "referencing>=0.35",
  "rfc8785>=0.1.4",
  "pyyaml>=6.0",
  "packageurl-python>=0.15",
  "httpx>=0.27",
  "spdx-python-model>=0.0.6",
  "cyclonedx-python-lib>=11.0",
  "cryptography>=43",
]

[project.optional-dependencies]
sign = ["sigstore>=4.5.1,<5", "in-toto-attestation>=0.9"]
models = ["model-signing>=1.0", "pyopenssl>=24"]
mcp = ["mcp>=1.9"]
shadowscan = ["NexusShadowScan>=0.1.4,<0.2"]
all = ["symbiote[sign,models,mcp]"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[project.scripts]
symbiote = "symbiote.cli:main"

[project.urls]
Homepage = "https://github.com/aisecnomad/symbiote"
Documentation = "https://aisecnomad.github.io/symbiote/"
Repository = "https://github.com/aisecnomad/symbiote"
Issues = "https://github.com/aisecnomad/symbiote/issues"
Changelog = "https://github.com/aisecnomad/symbiote/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/symbiote"]

[tool.hatch.build.targets.sdist]
include = ["src/symbiote", "spec", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PL", "T20"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "S101", "RUF012", "PLC0415", "E501", "N812", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PL", "T20"]
"src/symbiote/cli/**" = ["T20", "PLR0917"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "network: tests that require network access (skipped by default)",
  "live: tests that start a live MCP server subprocess",
]
filterwarnings = ["error::DeprecationWarning:symbiote.*"]

[tool.coverage.run]
source = ["symbiote"]
branch = true

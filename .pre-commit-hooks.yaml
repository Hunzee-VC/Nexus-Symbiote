- id: nexus-symbiote-scan
  name: Nexus SymBiote AIBOM Scan
  description: Scan for AI supply chain components and generate AIBOM
  entry: bash -c 'tmp="$(mktemp -d)" && trap "rm -rf -- \"$tmp\"" EXIT && nexus-symbiote scan . --policy none -f json -o "$tmp/aibom.json"'
  language: python
  always_run: true
  pass_filenames: false
  types: [file]

- id: nexus-symbiote-risk
  name: Nexus SymBiote Risk Gate
  description: Check AI supply chain risk score against threshold
  entry: bash -c 'tmp="$(mktemp -d)" && trap "rm -rf -- \"$tmp\"" EXIT && nexus-symbiote scan . --policy none -o "$tmp/check.json" && nexus-symbiote risk "$tmp/check.json" --policy none --threshold 50'
  language: system
  always_run: true
  pass_filenames: false
  types: [file]

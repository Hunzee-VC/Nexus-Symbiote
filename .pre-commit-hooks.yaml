- id: symbiote-scan
  name: SymBiote AIBOM Scan
  description: Scan for AI supply chain components and generate AIBOM
  entry: symbiote scan . --format json -o .symbiote-aibom.json
  language: python
  always_run: true
  pass_filenames: false
  types: [file]

- id: symbiote-risk
  name: SymBiote Risk Gate
  description: Check AI supply chain risk score against threshold
  entry: bash -c 'symbiote scan . -o /tmp/.symbiote-check.json && symbiote risk /tmp/.symbiote-check.json'
  language: system
  always_run: true
  pass_filenames: false
  types: [file]

- id: nexus-symbiote-scan
  name: Nexus SymBiote AIBOM Scan
  description: Scan for AI supply chain components and generate AIBOM
  entry: nexus-symbiote scan . --format json -o .nexus-symbiote-aibom.json
  language: python
  always_run: true
  pass_filenames: false
  types: [file]

- id: nexus-symbiote-risk
  name: Nexus SymBiote Risk Gate
  description: Check AI supply chain risk score against threshold
  entry: bash -c 'nexus-symbiote scan . -o /tmp/.nexus-symbiote-check.json && nexus-symbiote risk /tmp/.nexus-symbiote-check.json'
  language: system
  always_run: true
  pass_filenames: false
  types: [file]

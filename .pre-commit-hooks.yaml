- id: nexus-symbiote-scan
  name: Nexus SymBiote AgentBOM collection
  description: Collect a local inventory for review; this is not an execution approval
  entry: nexus-symbiote scan . --format json -o .nexus-symbiote-aibom.json
  language: python
  always_run: true
  pass_filenames: false
- id: nexus-symbiote-risk
  name: Nexus SymBiote risk gate
  description: Evaluate the inventory produced by the preceding nexus-symbiote-scan hook
  entry: nexus-symbiote risk .nexus-symbiote-aibom.json
  language: python
  always_run: true
  pass_filenames: false

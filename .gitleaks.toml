title = "Nexus SymBiote"
minVersion = "8.30.1"

[extend]
useDefault = true

# Each exception requires one exact repository-relative path AND one exact
# full matched value, and is limited to one detection rule.
# Hex escapes keep these patterns from becoming new token-shaped fixtures.
# Rationale and maintenance: docs/gitleaks-fixtures.md.

[[allowlists]]
description = "Public SHA-256 identifier of the walkthrough signing public key, not key material."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''^docs/inventory\-attestation\.md$''']
regexes = ['''^\x30\x34\x64\x64\x37\x64\x39\x61\x61\x65\x38\x63\x35\x30\x61\x35\x31\x39\x38\x63\x31\x64\x30\x61\x66\x62\x37\x36\x38\x30\x35\x31\x61\x64\x64\x65\x64\x61\x33\x36\x32\x64\x66\x63\x64\x66\x32\x64\x37\x39\x35\x66\x64\x33\x36\x32\x35\x38\x32\x30\x35\x66\x33\x39$''']


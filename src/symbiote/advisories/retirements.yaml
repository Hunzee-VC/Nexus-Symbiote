# One entry per model or alias, matched after symbiote.models_identity.hosted.classify_model_ref (so routing
# suffixes are stripped and the provider is attributed the same way as in the BOM). Entries are matched only
# within the named provider: the same model on Bedrock or Vertex has its own, different lifecycle.
#
# Every date carries its source. `confidence`:
#   high   - read from the provider's own documentation or repository in the research session
#   medium - read from a provider-published secondary source (an SDK docstring, a cached mirror of the docs)
#   low    - recalled from earlier documentation or taken from a third-party table, not re-fetched
# `successor` is set only where a source names one; otherwise the planner advises choosing a supported model.
# Whether a model is already retired is computed from `retires_on` and the check time, not stored here.

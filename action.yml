name: Nexus SymBiote AIBOM Scanner
description: "Generate and validate an agent BOM. Callers need contents: read, plus security-events: write when sarif-upload is true."
branding:
  icon: shield
  color: blue
inputs:
  scan-path:
    description: Project to scan
    default: "."
  format:
    description: "Output format: json, cyclonedx, spdx, sarif"
    default: json
  output-file:
    description: BOM output path
    default: nexus-symbiote-aibom.json
  scanners:
    description: "Comma-separated scanner names: a2a, ide_agents, mcp, model, prompt, rag, registry, shadowscan. Empty runs all of them."
    default: ""
  policy-file:
    description: "Policy file in the workspace, passed as --policy. Empty passes --policy none, so the scanned repository cannot choose the gate."
    default: ""
  validate:
    description: Run completeness and integrity validation
    default: "true"
  fail-on-validation-error:
    description: Fail the job when validation fails
    default: "true"
  risk-check:
    description: Run risk gate
    default: "true"
  risk-threshold:
    description: Risk threshold (0 explicitly disables the gate)
    default: "50"
  sarif-upload:
    description: Upload SARIF to GitHub Security
    default: "true"
  upload-artifact:
    description: Upload the AIBOM as a workflow artifact
    default: "true"
  python-version:
    description: Python version
    default: "3.12"
outputs:
  aibom-path:
    description: Path to BOM
    value: ${{ steps.scan.outputs.aibom_path }}
  risk-score:
    description: Risk score when the gate ran
    value: ${{ steps.risk.outputs.risk_score }}
  risk-passed:
    description: Whether the risk gate passed
    value: ${{ steps.risk.outputs.passed }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
    # Installs the revision of this action that the caller referenced. Python dependencies
    # are resolved from version ranges at install time; this action does not pin them.
    - name: Install this action's Nexus SymBiote revision
      shell: bash
      run: python -m pip install -- "${GITHUB_ACTION_PATH}[yaml]"
    - name: Scan once and export
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.scan-path }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        OUTPUT_FORMAT: ${{ inputs.format }}
        SCANNERS: ${{ inputs.scanners }}
        POLICY_FILE: ${{ inputs.policy-file }}
      run: |
        set -euo pipefail
        case "$OUTPUT_FORMAT" in json|cyclonedx|spdx|sarif) ;; *) echo "::error::Invalid output format"; exit 1;; esac
        case "$OUTPUT_FILE" in *$'\n'*|*$'\r'*|"") echo "::error::Invalid output path"; exit 1;; esac
        workdir="$(mktemp -d "$RUNNER_TEMP/nexus-symbiote.XXXXXXXX")"
        echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
        args=("$SCAN_PATH" -f json -o "$workdir/native.json")
        if [[ -n "${POLICY_FILE:-}" ]]; then args+=(--policy "$POLICY_FILE"); else args+=(--policy none); fi
        if [[ -n "$SCANNERS" ]]; then
          IFS=',' read -ra names <<< "$SCANNERS"
          for name in "${names[@]}"; do
            name="${name//[[:space:]]/}"
            case "$name" in a2a|ide_agents|mcp|model|prompt|rag|registry|shadowscan) ;; *) echo "::error::Invalid scanner"; exit 1;; esac
            args+=(--scanner "$name")
          done
        fi
        nexus-symbiote scan "${args[@]}"
        NATIVE_BOM="$workdir/native.json" SARIF_FILE="$workdir/results.sarif" python - <<'PY'
        import os
        from pathlib import Path
        from nexus_symbiote.core.aibom import AIBOM
        from nexus_symbiote.generators.cyclonedx import CycloneDXGenerator
        from nexus_symbiote.generators.spdx import SPDXGenerator
        from nexus_symbiote.generators.sarif import SARIFGenerator
        from nexus_symbiote.utils.fsio import write_text_safely

        native = Path(os.environ["NATIVE_BOM"])
        bom = AIBOM.load(native)
        generators = {"cyclonedx": CycloneDXGenerator, "spdx": SPDXGenerator, "sarif": SARIFGenerator}
        fmt = os.environ["OUTPUT_FORMAT"]
        output = Path(os.environ["OUTPUT_FILE"])
        if fmt == "json":
            write_text_safely(output, native.read_text(encoding="utf-8"))
        else:
            write_text_safely(output, generators[fmt]().generate_json(bom))
        write_text_safely(Path(os.environ["SARIF_FILE"]), SARIFGenerator().generate_json(bom))
        PY
        printf 'aibom_path=%s\n' "$OUTPUT_FILE" >> "$GITHUB_OUTPUT"
    - name: Validate
      if: inputs.validate == 'true'
      continue-on-error: ${{ inputs.fail-on-validation-error != 'true' }}
      shell: bash
      env:
        NATIVE_BOM: ${{ steps.scan.outputs.workdir }}/native.json
        SCAN_PATH: ${{ inputs.scan-path }}
        POLICY_FILE: ${{ inputs.policy-file }}
      run: |
        set -euo pipefail
        if [[ -n "${POLICY_FILE:-}" ]]; then policy=(--policy "$POLICY_FILE"); else policy=(--policy none); fi
        nexus-symbiote validate "$NATIVE_BOM" --project "$SCAN_PATH" "${policy[@]}"
    - name: Risk gate
      id: risk
      if: inputs.risk-check == 'true' && inputs.risk-threshold != '0'
      shell: bash
      env:
        NATIVE_BOM: ${{ steps.scan.outputs.workdir }}/native.json
        RISK_THRESHOLD: ${{ inputs.risk-threshold }}
        POLICY_FILE: ${{ inputs.policy-file }}
      run: |
        set -uo pipefail
        if [[ -n "${POLICY_FILE:-}" ]]; then policy=(--policy "$POLICY_FILE"); else policy=(--policy none); fi
        result="$(nexus-symbiote risk "$NATIVE_BOM" --threshold "$RISK_THRESHOLD" "${policy[@]}" --json-output)"
        status=$?
        score="$(printf '%s' "$result" | python -c 'import json,sys; print(json.load(sys.stdin)["overall_score"])')" || exit 1
        printf 'risk_score=%s\n' "$score" >> "$GITHUB_OUTPUT"
        if (( status != 0 )); then
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "::error::Nexus SymBiote risk gate failed"
          exit "$status"
        fi
        echo "passed=true" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      if: inputs.sarif-upload == 'true' && steps.scan.outcome == 'success' && always()
      uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      with:
        sarif_file: ${{ steps.scan.outputs.workdir }}/results.sarif
        category: nexus-symbiote
    - name: Upload AIBOM artifact
      if: inputs.upload-artifact == 'true' && steps.scan.outcome == 'success' && always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: nexus-symbiote-aibom
        path: ${{ inputs.output-file }}
